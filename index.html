<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kandy Heritage Web Map</title>


    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- Header -->
    <header>

        <h1>Kandy Heritage Web Map</h1>

    </header>


    <!-- Map -->
    <div id="map"></div>


    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- GeoRaster -->
    <script
        src="https://unpkg.com/georaster">
    </script>


    <!-- GeoRaster Leaflet -->
    <script
        src="https://unpkg.com/georaster-layer-for-leaflet">
    </script>


    <!-- Your JavaScript -->
    <script src="script.js"></script>

</body>

</html>
